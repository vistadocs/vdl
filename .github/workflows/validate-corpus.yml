name: validate-corpus

# Gate: the published VistA Documentation Library corpus must have clean,
# strictly-parseable frontmatter on every push and pull request. A broken
# corpus can never land on the default branch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Validate frontmatter
        run: python3 .ci/validate_frontmatter.py
